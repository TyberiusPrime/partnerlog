name: Android Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore debug keystore
        run: |
          mkdir -p signing
          echo "${{ secrets.PARTNERLOG_DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > signing/debug.keystore

      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_partnerlogDebugKeystorePassword: ${{ secrets.PARTNERLOG_DEBUG_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_partnerlogDebugKeyPassword: ${{ secrets.PARTNERLOG_DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: partnerlog-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
